<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLAS Study Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Math&display=swap">
<meta name="theme-color" content="#2547c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLAS">

<style>
/* Layout: engineering notebook on graph paper. One narrow reading column, sticky top bar, bottom tab bar for the thumb. */
:root {
  --paper: #f3f5f1;
  --grid: rgba(37, 71, 201, 0.06);
  --surface: #ffffff;
  --ink: #18202c;
  --muted: #5a6473;
  --line: #dde1e6;
  --accent: #2547c9;
  --accent-soft: #e6ebfb;
  --star: #b86b00;
  --star-soft: #fdf0d9;
  --good: #1f7a4a;
  --good-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --code-bg: #eef1f6;
  --shadow: 0 1px 2px rgba(24, 32, 44, 0.06), 0 4px 14px rgba(24, 32, 44, 0.06);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans Math", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", "Noto Sans Math", ui-monospace, Menlo, Consolas, monospace;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151c; --grid: rgba(142, 166, 255, 0.05); --surface: #1a2029; --ink: #e5e8ee; --muted: #9aa3b2;
    --line: #2b3340; --accent: #8ea6ff; --accent-soft: #232d4a; --star: #f0b54a; --star-soft: #3a2e17;
    --good: #5fd08f; --good-soft: #1b3326; --bad: #ff8a80; --bad-soft: #3d1f1d; --code-bg: #141a23;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151c; --grid: rgba(142, 166, 255, 0.05); --surface: #1a2029; --ink: #e5e8ee; --muted: #9aa3b2;
  --line: #2b3340; --accent: #8ea6ff; --accent-soft: #232d4a; --star: #f0b54a; --star-soft: #3a2e17;
  --good: #5fd08f; --good-soft: #1b3326; --bad: #ff8a80; --bad-soft: #3d1f1d; --code-bg: #141a23;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.topbar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 36px; }
.back {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  width: 36px; height: 36px; display: grid; place-items: center; flex: none;
}
.back svg { width: 18px; height: 18px; }
.topbar h1 {
  font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin: 0; line-height: 1.2;
  letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
.topbar .course-tag {
  font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; flex: none;
}

/* ---------- main column ---------- */
main {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2.section { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; margin: 6px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; font-size: 0.95rem; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.02em;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.2; }

/* ---------- generic blocks ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.pad { padding: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px;
  font-size: 0.85rem; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .muted { color: inherit; opacity: 0.75; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 12px;
  padding: 12px 16px; font-weight: 600; text-align: center;
}
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.star { color: var(--star); }
.badge-star {
  display: inline-block; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.04em;
  color: var(--star); background: var(--star-soft); border-radius: 5px; padding: 1px 6px; vertical-align: 2px;
}
.qid { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* progress bar */
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: 99px; }

/* ---------- learn: lecture list ---------- */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.search {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; font-size: 1rem;
}
.lect-list { display: flex; flex-direction: column; gap: 8px; }
.lect {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left;
  padding: 12px 14px; width: 100%;
}
.lect .num {
  font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--accent);
  background: var(--accent-soft); border-radius: 10px; height: 44px; display: grid; place-items: center;
}
.lect .t { font-weight: 600; line-height: 1.3; }
.lect .meta { font-size: 0.8rem; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center; }
.lect .meta .bar { flex: 1; max-width: 120px; }
.lect .pct { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- learn: questions ---------- */
.formulas { padding: 14px 16px; border-left: 3px solid var(--accent); }
.formulas h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 1rem; }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.q { overflow: hidden; }
.q > button.qhead {
  width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px;
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start;
}
.q .qtitle { font-weight: 600; line-height: 1.35; }
.q .state { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 2px; display: grid; place-items: center; }
.q .state.known { background: var(--good); border-color: var(--good); }
.q .state.known::after { content: ""; width: 6px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.q .state.learning { border-color: var(--star); }
.q .qbody { padding: 0 16px 14px; border-top: 1px dashed var(--line); }
.q .src { font-size: 0.8rem; color: var(--muted); margin: 10px 0 0; font-style: italic; }
.mark-row { display: flex; gap: 8px; margin-top: 12px; }
.mark-row .btn { flex: 1; padding: 10px; font-size: 0.9rem; }

/* markdown content */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0.6em 0; }
.md ul, .md ol { padding-left: 1.3em; }
.md li { margin: 0.25em 0; }
.md strong { font-weight: 600; }
.md code { font-family: var(--f-mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.md pre {
  font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.5; background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 0.8em 0;
}
.md pre code { background: none; padding: 0; font-size: inherit; white-space: pre; }
.tbl { overflow-x: auto; margin: 0.8em 0; border: 1px solid var(--line); border-radius: 10px; }
.md table { border-collapse: collapse; font-size: 0.85rem; min-width: 100%; width: max-content; }
.md th, .md td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 6.5em; max-width: 18em; overflow-wrap: normal; }
.md th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md em { color: inherit; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }

/* ---------- flashcards ---------- */
.deck-picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.deck-picker::-webkit-scrollbar { display: none; }
.flash {
  min-height: 300px; display: flex; flex-direction: column; padding: 18px; gap: 12px;
}
.flash .front { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; line-height: 1.3; text-wrap: balance; }
.flash .hint { margin-top: auto; text-align: center; color: var(--muted); font-size: 0.85rem; }
.flash .answer { border-top: 1px dashed var(--line); padding-top: 12px; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade button { border-radius: 12px; padding: 12px 6px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.grade .again { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.grade .hard { color: var(--star); border-color: var(--star); background: var(--star-soft); }
.grade .easy { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.grade small { display: block; font-weight: 400; font-size: 0.72rem; opacity: 0.85; }

/* ---------- quiz ---------- */
.opt {
  width: 100%; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; line-height: 1.4;
}
.opt .letter { font-family: var(--f-mono); font-size: 0.8rem; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--code-bg); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.feedback { padding: 14px 16px; border-radius: 12px; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 4px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.score-big { font-family: var(--f-display); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- exams ---------- */
.exam-card { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 14px 16px; }
.exam-card .d { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.pill { font-family: var(--f-mono); font-size: 0.7rem; border-radius: 6px; padding: 2px 7px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.gray { background: var(--code-bg); color: var(--muted); }
.pages { display: flex; flex-direction: column; gap: 10px; }
.page-img { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: block; cursor: zoom-in; }
.viewer {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 16, 0.94); overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 56px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  -webkit-overflow-scrolling: touch;
}
.viewer img { display: block; background: #fff; max-width: none; }
.viewer .vbar {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; gap: 8px; justify-content: flex-end;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
}
.viewer .vbar button { background: #2a2f38; color: #f2f4f7; border: 1px solid #3c4350; border-radius: 10px; padding: 8px 14px; font-weight: 600; }

/* ---------- boards ---------- */
.board { padding: 14px 16px; }
.board h3 { font-family: var(--f-display); font-size: 1.05rem; margin: 0 0 8px; text-wrap: balance; }
.board.covered .md { filter: blur(7px); user-select: none; cursor: pointer; transition: filter 0.2s; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.switch { width: 46px; height: 28px; border-radius: 99px; background: var(--line); border: 0; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: left 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 21px; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 560px) { .flash .front { font-size: 1.4rem; } }
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="back" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">Learn</h1>
    <span class="course-tag" id="courseTag">SLAS</span>
  </div>
</header>

<main id="view"><div class="loading">Loading the question bank…</div></main>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-inner">
    <button class="tab" data-tab="learn" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></svg>
      Learn
    </button>
    <button class="tab" data-tab="cards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
      Cards
    </button>
    <button class="tab" data-tab="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5v.01"/></svg>
      Quiz
    </button>
    <button class="tab" data-tab="exams">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>
      Exams
    </button>
    <button class="tab" data-tab="boards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20l4-4 4 4"/><path d="M7 9h5M7 12h8"/></svg>
      Boards
    </button>
  </div>
</nav>

<script src="marked.min.js"></script>
<script src="quiz.js"></script>
<script>
// ======================================================================
// Course configuration. To add a course later: add an entry here with
// its own question bank (.md), quiz file and exam page images.
// ======================================================================
const COURSE = {
  key: "slas",
  tag: "SLAS",
  name: "Statistical Learning for Automation Systems",
  bank: "bank.md",
  exams: [
    { date: "7 Nov 2022", iso: "2022-11-07", pages: 3, topics: ["Classification", "Neural networks", "Model selection", "Clustering"] },
    { date: "6 Feb 2023", iso: "2023-02-06", pages: 4, topics: ["k-nearest neighbors", "Neural networks", "Model selection", "Clustering"] },
    { date: "3 Jul 2023", iso: "2023-07-03", pages: 4, topics: ["Model selection", "Linear classification", "Nonparametric classification", "Stochastic processes"] },
    { date: "7 Sep 2023", iso: "2023-09-07", pages: 4, topics: ["Linear regression", "Neural networks", "Nonparametric classification", "Write your own question"] },
    { date: "12 Nov 2024", iso: "2024-11-12", pages: 9, official: true },
    { date: "9 Jan 2025", iso: "2025-01-09", pages: 8, official: true },
    { date: "13 Feb 2025", iso: "2025-02-13", pages: 8, official: true },
    { date: "21 Jan 2026", iso: "2026-01-21", pages: 8, official: true },
    { date: "11 Feb 2026", iso: "2026-02-11", pages: 5, official: true }
  ]
};

// ---------------------------------------------------------------------
// Saved progress (only on this device). Every access is wrapped because
// storage can be blocked (private mode, previews).
// ---------------------------------------------------------------------
const STORE_KEY = "study-" + COURSE.key;
let progress = { cards: {}, quizBest: {}, cover: false };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved) progress = Object.assign(progress, saved);
} catch (e) { /* start fresh */ }
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* ignore */ }
}

// Leitner boxes: 0 = new/again, 1..5 = learnt more and more. Box >= 3 counts as "known".
const INTERVAL_HOURS = [0, 4, 24, 72, 168, 336];
function cardState(id) { return progress.cards[id] || { box: 0, due: 0, seen: false }; }
function isKnown(id) { return cardState(id).box >= 3; }
function grade(id, how) {
  const s = cardState(id);
  let box = s.box;
  if (how === "again") box = 0;
  if (how === "hard") box = Math.max(1, box);
  if (how === "easy") box = Math.min(5, Math.max(3, box + 1));
  progress.cards[id] = { box: box, due: Date.now() + INTERVAL_HOURS[box] * 3600e3, seen: true };
  save();
}

// ---------------------------------------------------------------------
// Parse the question bank markdown into lectures, questions, boards and
// past-exam topics. Structure (from the file):
//   # Blackboard sheet  -> ## Board N – title
//   # Part I            -> ## Lecture N – title -> ### Key formulas, ### LN.Qk – question
//   # Part II           -> ## A. Topic -> ### EX.A1 – question
// ---------------------------------------------------------------------
const data = { boards: [], lectures: [], topics: [], byId: {} };

function parseBank(md) {
  const lines = md.split("\n");
  let part = "";            // current "# " heading
  let group = null;         // current "## " object
  let item = null;          // current "### " object (question or formulas)
  let inFence = false;

  function closeItem() { item = null; }

  for (const line of lines) {
    if (line.startsWith("```")) inFence = !inFence;
    if (!inFence && /^# /.test(line)) {
      part = line.slice(2).trim();
      group = null; closeItem();
      continue;
    }
    if (!inFence && /^## /.test(line)) {
      const title = line.slice(3).trim();
      closeItem();
      if (part.startsWith("Blackboard")) {
        group = { title: title, body: "" };
        data.boards.push(group);
      } else if (part.startsWith("Part I –") || part === "Part I – Questions from the slides") {
        const m = title.match(/^Lecture (\d+) – (.*)$/);
        group = {
          id: m ? "L" + m[1] : "BP",
          num: m ? m[1] : "★",
          title: m ? m[2] : title,
          formulas: "",
          questions: []
        };
        data.lectures.push(group);
      } else if (part.startsWith("Part II")) {
        const m = title.match(/^([A-Z])\. (.*)$/);
        group = m ? { letter: m[1], title: m[2], questions: [] } : null;
        if (group) data.topics.push(group);
      } else {
        group = null;
      }
      continue;
    }
    if (!inFence && /^### /.test(line) && group && group.questions) {
      const title = line.slice(4).trim();
      if (title === "Key formulas") {
        item = { formulas: true };
        continue;
      }
      const m = title.match(/^(\S+) – (.*)$/);
      if (!m) { item = null; continue; }
      const star = /★\s*$/.test(m[2]);
      item = {
        id: m[1],
        title: m[2].replace(/\s*★\s*$/, ""),
        star: star,
        source: "",
        body: "",
        group: group
      };
      group.questions.push(item);
      data.byId[item.id] = item;
      continue;
    }
    // Plain content line
    if (item && item.formulas) { group.formulas += line + "\n"; continue; }
    if (item) {
      if (!item.source && !item.body.trim() && /^\*(Source|Exams?):/.test(line)) {
        item.source = line.replace(/^\*|\*$/g, "");
        continue;
      }
      item.body += line + "\n";
      continue;
    }
    if (group && part.startsWith("Blackboard")) group.body += line + "\n";
  }
  // Drop trailing "---" separators from bodies
  for (const q of Object.values(data.byId)) q.body = q.body.replace(/\n-{3,}\s*$/, "").trim();
  for (const l of data.lectures) l.formulas = l.formulas.replace(/\n-{3,}\s*$/, "").trim();
  for (const b of data.boards) b.body = b.body.trim();
}

function allPart1() { return data.lectures.flatMap(l => l.questions); }
function allPart2() { return data.topics.flatMap(t => t.questions); }

// Markdown -> HTML, with every table wrapped so it can scroll sideways on a phone.
function md(text) {
  const html = marked.parse(text || "", { mangle: false, headerIds: false });
  return html.replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------------------------------------------------------------------
// Navigation: a small stack of screens per tab.
// ---------------------------------------------------------------------
const view = document.getElementById("view");
const titleEl = document.getElementById("title");
const backBtn = document.getElementById("backBtn");
let currentTab = "learn";
let stack = [];

function go(screen) { stack.push(screen); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === tab ? "page" : "false"));
  stack = [{ name: tab }];
  render();
}
function render() {
  const screen = stack[stack.length - 1];
  backBtn.hidden = stack.length <= 1;
  view.innerHTML = "";
  SCREENS[screen.name](screen);
  window.scrollTo(0, screen.scroll || 0);
}
backBtn.addEventListener("click", back);
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function setTitle(t) { titleEl.textContent = t; }

// A question rendered as a collapsible card (used in Learn, search and Exams).
function questionCard(q, open) {
  const s = cardState(q.id);
  const cls = isKnown(q.id) ? "known" : (s.seen ? "learning" : "");
  const node = el(`
    <article class="card q" id="q-${esc(q.id)}">
      <button class="qhead" aria-expanded="${open ? "true" : "false"}">
        <span>
          <span class="qid">${esc(q.id)}</span> ${q.star ? '<span class="badge-star">★ must-know</span>' : ""}
          <div class="qtitle">${esc(q.title)}</div>
        </span>
        <span class="state ${cls}" aria-label="${cls === "known" ? "Known" : "Not known yet"}"></span>
      </button>
      <div class="qbody" ${open ? "" : "hidden"}>
        ${q.source ? `<p class="src">${esc(q.source)}</p>` : ""}
        <div class="md">${md(q.body)}</div>
        <div class="mark-row">
          <button class="btn ghost" data-mark="again">Review again</button>
          <button class="btn" data-mark="easy">I know it</button>
        </div>
      </div>
    </article>`);
  const head = node.querySelector(".qhead");
  const body = node.querySelector(".qbody");
  head.addEventListener("click", () => {
    body.hidden = !body.hidden;
    head.setAttribute("aria-expanded", String(!body.hidden));
  });
  node.querySelectorAll("[data-mark]").forEach(b => b.addEventListener("click", () => {
    grade(q.id, b.dataset.mark);
    const st = node.querySelector(".state");
    st.className = "state " + (isKnown(q.id) ? "known" : "learning");
    body.hidden = true;
    head.setAttribute("aria-expanded", "false");
  }));
  return node;
}

function openQuestion(id) {
  const q = data.byId[id];
  if (!q) return;
  go({ name: "question", id: id });
}

// ---------------- Flashcards ----------------
let deck = null; // { key, queue: [ids], index, flipped, done }

function deckCards(key) {
  if (key === "star") return allPart1().filter(q => q.star);
  if (key === "all") return allPart1();
  if (key === "exam") return allPart2();
  if (key === "weak") return allPart1().filter(q => cardState(q.id).seen && !isKnown(q.id));
  if (key.startsWith("L:")) { const l = data.lectures.find(x => x.id === key.slice(2)); return l ? l.questions : []; }
  return [];
}
function startDeck(key, includeAll) {
  const now = Date.now();
  let cards = deckCards(key);
  if (!includeAll) cards = cards.filter(q => cardState(q.id).due <= now);
  // New/again cards first, ★ before the others, then shuffle within each group.
  const order = q => (cardState(q.id).box) * 2 + (q.star ? 0 : 1);
  const sorted = shuffle(cards).sort((a, b) => order(a) - order(b));
  deck = { key: key, queue: sorted.map(q => q.id), index: 0, flipped: false, reviewed: 0, total: sorted.length };
  stack = [{ name: "cards" }];
  render();
}

SCREENS.cards = function () {
  setTitle("Flashcards");
  const decks = [
    ["star", "★ Must-know"], ["all", "All lectures"], ["weak", "Weak spots"], ["exam", "Past exam Qs"]
  ].concat(data.lectures.filter(l => l.id !== "BP").map(l => ["L:" + l.id, "L" + l.num]));
  const key = deck ? deck.key : "star";
  const picker = el(`<div class="deck-picker"></div>`);
  for (const [k, label] of decks) {
    const now = Date.now();
    const n = deckCards(k).filter(q => cardState(q.id).due <= now).length;
    const b = el(`<button class="chip" aria-pressed="${k === key}">${esc(label)} <span class="muted tnum">${n}</span></button>`);
    b.addEventListener("click", () => startDeck(k));
    picker.append(b);
  }
  view.append(picker);

  if (!deck) startDeckSilently("star");
  const id = deck.queue[deck.index];
  if (!id) {
    const box = el(`<div class="card pad empty">
      <p style="font-size:1.05rem;color:var(--ink);margin:0 0 6px"><b>${deck.total ? "Deck finished" : "Nothing due in this deck"}</b></p>
      <p style="margin:0 0 14px">${deck.reviewed ? `You reviewed ${deck.reviewed} cards. ` : ""}Cards come back after 4 hours to 2 weeks, depending on how well you knew them.</p>
      <button class="btn" id="again">Study all ${deckCards(deck.key).length} cards anyway</button>
    </div>`);
    box.querySelector("#again").addEventListener("click", () => startDeck(deck.key, true));
    view.append(box);
    return;
  }
  const q = data.byId[id];
  const left = deck.queue.length - deck.index;
  view.append(el(`<div class="row small muted"><span class="grow">${left} left in this session</span><span class="qid">${esc(q.id)}</span></div>`));
  const card = el(`<article class="card flash">
    <div>${q.star ? '<span class="badge-star">★ must-know</span>' : ""}</div>
    <div class="front">${esc(q.title)}</div>
    <div class="answer" ${deck.flipped ? "" : "hidden"}>
      ${q.source ? `<p class="src small muted" style="margin:0 0 8px;font-style:italic">${esc(q.source)}</p>` : ""}
      <div class="md">${md(q.body)}</div>
    </div>
    <div class="hint" ${deck.flipped ? "hidden" : ""}>Answer out loud, then tap to check</div>
  </article>`);
  card.addEventListener("click", () => { if (!deck.flipped) { deck.flipped = true; render(); } });
  view.append(card);

  if (deck.flipped) {
    const g = el(`<div class="grade">
      <button class="again" data-g="again">Didn't know<small>see again soon</small></button>
      <button class="hard" data-g="hard">Partly<small>in 4 h</small></button>
      <button class="easy" data-g="easy">Knew it<small>in 1+ days</small></button>
    </div>`);
    g.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => {
      grade(id, b.dataset.g);
      deck.reviewed++;
      // A card you didn't know comes back 4 cards later in the same session.
      if (b.dataset.g === "again") deck.queue.splice(Math.min(deck.queue.length, deck.index + 5), 0, id);
      deck.index++;
      deck.flipped = false;
      render();
    }));
    view.append(g);
  } else {
    const b = el(`<button class="btn">Show answer</button>`);
    b.addEventListener("click", () => { deck.flipped = true; render(); });
    view.append(b);
  }
};
function startDeckSilently(key) {
  const now = Date.now();
  let cards = deckCards(key).filter(q => cardState(q.id).due <= now);
  const order = q => (cardState(q.id).box) * 2 + (q.star ? 0 : 1);
  cards = shuffle(cards).sort((a, b) => order(a) - order(b));
  deck = { key: key, queue: cards.map(q => q.id), index: 0, flipped: false, reviewed: 0, total: cards.length };
}

// ---------------- Quiz ----------------
let quiz = null; // { lecture, items, index, answered, correct, wrong: [] }

function startQuiz(lecture) {
  const pool = window.QUIZ.filter(x => lecture === "all" || x.l === lecture);
  const items = shuffle(pool).slice(0, 10).map(x => {
    const order = shuffle(x.o.map((_, i) => i));
    return { src: x, order: order };
  });
  quiz = { lecture: lecture, items: items, index: 0, answered: null, correct: 0, wrong: [] };
  stack = [{ name: "quiz" }];
  render();
}

SCREENS.quiz = function () {
  setTitle("Quiz");
  if (!quiz) {
    view.append(el(`<div><div class="eyebrow">${window.QUIZ.length} questions · 10 per round</div>
      <h2 class="section">Pick what to test</h2></div>`));
    view.append(el(`<p class="lede">Each answer links to the full explanation in your question bank.</p>`));
    const grid = el(`<div class="lect-list"></div>`);
    const options = [["all", "Mixed: all lectures", window.QUIZ.length]].concat(
      data.lectures.filter(l => l.id !== "BP").map(l => [Number(l.num), l.title, window.QUIZ.filter(x => x.l === Number(l.num)).length])
    );
    for (const [key, label, n] of options) {
      const best = progress.quizBest[key];
      const b = el(`<button class="card lect">
        <span class="num">${key === "all" ? "∑" : "L" + key}</span>
        <span style="min-width:0"><div class="t">${esc(label)}</div><div class="meta"><span class="tnum">${n} questions</span></div></span>
        <span class="pct">${best != null ? "best " + best + "%" : ""}</span>
      </button>`);
      b.addEventListener("click", () => startQuiz(key));
      grid.append(b);
    }
    view.append(grid);
    return;
  }

  // Finished
  if (quiz.index >= quiz.items.length) {
    const pct = Math.round(100 * quiz.correct / quiz.items.length);
    const prev = progress.quizBest[quiz.lecture];
    if (prev == null || pct > prev) { progress.quizBest[quiz.lecture] = pct; save(); }
    view.append(el(`<div class="card pad" style="text-align:center">
      <div class="eyebrow">${quiz.lecture === "all" ? "Mixed" : "Lecture " + quiz.lecture}</div>
      <div class="score-big">${quiz.correct}/${quiz.items.length}</div>
      <p class="muted" style="margin:6px 0 0">${pct >= 80 ? "Strong. Try another lecture." : pct >= 50 ? "Good base. Review the ones you missed below." : "Go back to the Learn tab for this lecture, then retry."}</p>
    </div>`));
    if (quiz.wrong.length) {
      view.append(el(`<h2 class="section">To review</h2>`));
      const list = el(`<div class="qlist"></div>`);
      for (const w of quiz.wrong) {
        const r = data.byId[w.ref];
        const node = el(`<div class="card pad">
          <div class="qtitle" style="font-weight:600">${esc(w.q)}</div>
          <p class="small" style="margin:6px 0"><span style="color:var(--good)">✓ ${esc(w.o[w.a])}</span></p>
          <p class="small muted" style="margin:0 0 8px">${esc(w.e)}</p>
          ${r ? `<button class="linkbtn small">Read ${esc(w.ref)} in full</button>` : ""}
        </div>`);
        const lb = node.querySelector(".linkbtn");
        if (lb) lb.addEventListener("click", () => openQuestion(w.ref));
        list.append(node);
      }
      view.append(list);
    }
    const row = el(`<div class="row"><button class="btn ghost grow" id="pick">Choose another</button><button class="btn grow" id="retry">New round</button></div>`);
    row.querySelector("#pick").addEventListener("click", () => { quiz = null; render(); });
    row.querySelector("#retry").addEventListener("click", () => startQuiz(quiz.lecture));
    view.append(row);
    return;
  }

  const it = quiz.items[quiz.index];
  const x = it.src;
  view.append(el(`<div class="row small muted"><span class="grow tnum">Question ${quiz.index + 1} of ${quiz.items.length} · ${quiz.correct} correct</span><span class="qid">L${x.l}</span></div>`));
  view.append(el(`<div class="bar"><i style="width:${100 * quiz.index / quiz.items.length}%;background:var(--accent)"></i></div>`));
  view.append(el(`<div class="card pad"><div style="font-family:var(--f-display);font-weight:600;font-size:1.15rem;line-height:1.35;text-wrap:balance">${esc(x.q)}</div></div>`));
  const opts = el(`<div class="qlist"></div>`);
  it.order.forEach((oi, pos) => {
    const answered = quiz.answered != null;
    let cls = "";
    if (answered && oi === x.a) cls = "right";
    if (answered && oi === quiz.answered && oi !== x.a) cls = "wrong";
    const b = el(`<button class="opt ${cls}" ${answered ? "disabled" : ""}><span class="letter">${"ABCD"[pos]}</span><span>${esc(x.o[oi])}</span></button>`);
    b.addEventListener("click", () => {
      quiz.answered = oi;
      if (oi === x.a) quiz.correct++; else quiz.wrong.push(x);
      render();
    });
    opts.append(b);
  });
  view.append(opts);

  if (quiz.answered != null) {
    const ok = quiz.answered === x.a;
    const fb = el(`<div class="feedback ${ok ? "ok" : "no"}">
      <b>${ok ? "Correct" : "Not quite"}</b>
      <span>${esc(x.e)}</span>
      ${data.byId[x.ref] ? `<div style="margin-top:8px"><button class="linkbtn small">Read ${esc(x.ref)} in full</button></div>` : ""}
    </div>`);
    const lb = fb.querySelector(".linkbtn");
    if (lb) lb.addEventListener("click", () => openQuestion(x.ref));
    view.append(fb);
    const next = el(`<button class="btn">${quiz.index + 1 < quiz.items.length ? "Next question" : "See results"}</button>`);
    next.addEventListener("click", () => { quiz.index++; quiz.answered = null; render(); });
    view.append(next);
  }
};

// ---------------- Exams ----------------
function examQuestions(date) {
  // Part II questions whose exam line mentions this date (e.g. "7 Nov 2022").
  return allPart2().filter(q => q.source.includes(date));
}

// Topics of an exam: listed by hand, or taken from the bank's past-question topics.
function examTopics(ex) {
  if (ex.topics) return ex.topics;
  const names = [];
  for (const q of examQuestions(ex.date)) if (!names.includes(q.group.title)) names.push(q.group.title);
  return names;
}

SCREENS.exams = function () {

  view.append(el(`<div><div class="eyebrow">Nov 2022 – Feb 2026</div><h2 class="section">Exam papers and solutions</h2></div>`));
  view.append(el(`<p class="lede">Try the paper first, then open the solutions from your question bank.</p>`));
  const list = el(`<div class="lect-list"></div>`);
  for (const ex of COURSE.exams) {
    const n = examQuestions(ex.date).length;
    const b = el(`<button class="card exam-card">
      <span style="min-width:0">
        <div class="d">${esc(ex.date)}</div>
        <div class="small muted">${esc(examTopics(ex).join(" · "))}</div>
      </span>
      <span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
        ${ex.pages ? `<span class="pill">${ex.pages} pages</span>` : `<span class="pill gray">no paper</span>`}
        ${ex.official ? `<span class="pill">+ official sol.</span>` : ""}
        <span class="pill gray tnum">${n} solved</span>
      </span>
    </button>`);
    b.addEventListener("click", () => { stack[stack.length - 1].scroll = window.scrollY; go({ name: "exam", date: ex.date }); });
    list.append(b);
  }
  view.append(list);

  view.append(el(`<h2 class="section">Past questions by topic</h2>`));
  const tl = el(`<div class="lect-list"></div>`);
  for (const t of data.topics) {
    const k = t.questions.filter(q => isKnown(q.id)).length;
    const b = el(`<button class="card lect">
      <span class="num">${esc(t.letter)}</span>
      <span style="min-width:0"><div class="t">${esc(t.title)}</div><div class="meta"><span class="tnum">${t.questions.length} questions</span></div></span>
      <span class="pct tnum">${k}/${t.questions.length}</span>
    </button>`);
    b.addEventListener("click", () => { stack[stack.length - 1].scroll = window.scrollY; go({ name: "topic", letter: t.letter }); });
    tl.append(b);
  }
  view.append(tl);
};

SCREENS.exam = function (screen) {
  const ex = COURSE.exams.find(e => e.date === screen.date);
  setTitle(ex.date);
  view.append(el(`<div><div class="eyebrow">Model Identification and Data Analysis – Part 1</div><h2 class="section">Exam of ${esc(ex.date)}</h2></div>`));
  if (ex.pages) {
    view.append(el(`<p class="lede">Tap a page to open it full screen and zoom.${ex.official ? " The official solutions are in the PDF pages, right after each exercise: cover them if you want to try first." : ""}</p>`));
    const pages = el(`<div class="pages"></div>`);
    for (let p = 1; p <= ex.pages; p++) {
      const src = `exams/${ex.iso}-${p}.jpg`;
      const img = el(`<img class="page-img" loading="lazy" alt="Exam ${esc(ex.date)}, page ${p}" src="${src}">`);
      img.addEventListener("click", () => openViewer(src));
      pages.append(img);
    }
    view.append(pages);
  }
  const qs = examQuestions(ex.date);
  view.append(el(`<h2 class="section">Solutions <span class="muted tnum" style="font-size:1rem">${qs.length}</span></h2>`));
  if (!qs.length) view.append(el(`<div class="card empty">This exam's exercises are on topics not covered yet in Lectures 1–10.</div>`));
  const list = el(`<div class="qlist"></div>`);
  for (const q of qs) list.append(questionCard(q, false));
  view.append(list);
};

SCREENS.topic = function (screen) {
  const t = data.topics.find(x => x.letter === screen.letter);
  setTitle(t.letter + ". " + t.title);
  view.append(el(`<div><div class="eyebrow">Past exam questions</div><h2 class="section">${esc(t.title)}</h2></div>`));
  const list = el(`<div class="qlist"></div>`);
  for (const q of t.questions) list.append(questionCard(q, false));
  view.append(list);
};

function openViewer(src) {
  let zoom = 1;
  const v = el(`<div class="viewer" role="dialog" aria-label="Exam page">
    <div class="vbar"><button id="zoomBtn">Zoom 2×</button><button id="closeBtn">Close</button></div>
    <img alt="Exam page" src="${src}">
  </div>`);
  const img = v.querySelector("img");
  const size = () => { img.style.width = (zoom * 100) + "vw"; };
  size();
  v.querySelector("#zoomBtn").addEventListener("click", () => {
    zoom = zoom === 1 ? 2 : 1;
    v.querySelector("#zoomBtn").textContent = zoom === 1 ? "Zoom 2×" : "Fit width";
    size();
  });
  v.querySelector("#closeBtn").addEventListener("click", () => v.remove());
  document.body.append(v);
}

// ---------------- Boards ----------------
SCREENS.boards = function () {
  setTitle("Blackboard");
  view.append(el(`<div><div class="eyebrow">${data.boards.length} boards</div><h2 class="section">Write it from memory</h2></div>`));
  view.append(el(`<p class="lede">Copy each board on paper, then switch on cover mode and rewrite it. Tap a covered board to check yourself. (D) marks derivations to redo on paper.</p>`));
  const tg = el(`<div class="card toggle"><span class="grow"><b>Cover mode</b><div class="small muted">Blur the boards until you tap them</div></span>
    <button class="switch" role="switch" id="coverSwitch" aria-checked="${progress.cover}" aria-label="Cover mode"></button></div>`);
  tg.querySelector("#coverSwitch").addEventListener("click", () => { progress.cover = !progress.cover; save(); render(); });
  view.append(tg);
  for (const b of data.boards) {
    const node = el(`<section class="card board ${progress.cover ? "covered" : ""}"><h3>${esc(b.title)}</h3><div class="md">${md(b.body)}</div></section>`);
    node.querySelector(".md").addEventListener("click", () => node.classList.remove("covered"));
    view.append(node);
  }
};

// Offline support: the service worker keeps a copy of every file on the device.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* app still works online */ });
}

// ======================================================================
// Boot
// ======================================================================
fetch(COURSE.bank)
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(text => {
    parseBank(text);
    switchTab("learn");
  })
  .catch(err => {
    view.innerHTML = "";
    view.append(el(`<div class="card pad empty">The question bank could not load (${esc(err.message)}). Reload the page to try again.</div>`));
  });
</script>
</body>
</html>
