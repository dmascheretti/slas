<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLAS Study Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Math&display=swap">
<meta name="theme-color" content="#2547c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SLAS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Layout: engineering notebook on graph paper. One narrow reading column, sticky top bar, bottom tab bar for the thumb. */
:root {
  --paper: #f3f5f1;
  --grid: rgba(37, 71, 201, 0.06);
  --surface: #ffffff;
  --ink: #18202c;
  --muted: #5a6473;
  --line: #dde1e6;
  --accent: #2547c9;
  --accent-soft: #e6ebfb;
  --star: #b86b00;
  --star-soft: #fdf0d9;
  --good: #1f7a4a;
  --good-soft: #e1f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --code-bg: #eef1f6;
  /* chart series, validated for CVD and contrast: light */
  --c1: #2547c9; --c2: #c2410c; --c3: #1f7a4a; --c4: #7c3aed;
  --shadow: 0 1px 2px rgba(24, 32, 44, 0.06), 0 4px 14px rgba(24, 32, 44, 0.06);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans Math", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", "Noto Sans Math", ui-monospace, Menlo, Consolas, monospace;
  --tabbar-h: 62px;
  --fs: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151c; --grid: rgba(142, 166, 255, 0.05); --surface: #1a2029; --ink: #e5e8ee; --muted: #9aa3b2;
    --line: #2b3340; --accent: #8ea6ff; --accent-soft: #232d4a; --star: #f0b54a; --star-soft: #3a2e17;
    --good: #5fd08f; --good-soft: #1b3326; --bad: #ff8a80; --bad-soft: #3d1f1d; --code-bg: #141a23;
    --c1: #5b7cf0; --c2: #e0682f; --c3: #2f9e5e; --c4: #9a78ee;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151c; --grid: rgba(142, 166, 255, 0.05); --surface: #1a2029; --ink: #e5e8ee; --muted: #9aa3b2;
  --line: #2b3340; --accent: #8ea6ff; --accent-soft: #232d4a; --star: #f0b54a; --star-soft: #3a2e17;
  --good: #5fd08f; --good-soft: #1b3326; --bad: #ff8a80; --bad-soft: #3d1f1d; --code-bg: #141a23;
    --c1: #5b7cf0; --c2: #e0682f; --c3: #2f9e5e; --c4: #9a78ee;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--fs);
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.topbar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 36px; }
.back {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  width: 36px; height: 36px; display: grid; place-items: center; flex: none;
}
.back svg { width: 18px; height: 18px; }
.topbar h1 {
  font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin: 0; line-height: 1.2;
  letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
.topbar .course-tag {
  font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; flex: none;
}

/* ---------- main column ---------- */
main {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h2.section { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; margin: 6px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; font-size: 0.95rem; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.02em;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.2; }

/* ---------- generic blocks ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.pad { padding: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px;
  font-size: 0.85rem; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .muted { color: inherit; opacity: 0.75; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 12px;
  padding: 12px 16px; font-weight: 600; text-align: center;
}
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.star { color: var(--star); }
.badge-star {
  display: inline-block; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.04em;
  color: var(--star); background: var(--star-soft); border-radius: 5px; padding: 1px 6px; vertical-align: 2px;
}
.qid { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* progress bar */
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: 99px; }

/* ---------- learn: lecture list ---------- */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.search {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; font-size: 1rem;
}
.lect-list { display: flex; flex-direction: column; gap: 8px; }
.lect {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left;
  padding: 12px 14px; width: 100%;
}
.lect .num {
  font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--accent);
  background: var(--accent-soft); border-radius: 10px; height: 44px; display: grid; place-items: center;
}
.lect .t { font-weight: 600; line-height: 1.3; }
.lect .meta { font-size: 0.8rem; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center; }
.lect .meta .bar { flex: 1; max-width: 120px; }
.lect .pct { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- learn: questions ---------- */
.formulas { padding: 14px 16px; border-left: 3px solid var(--accent); }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.q { overflow: hidden; }
.q .state { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 2px; display: grid; place-items: center; }
.q .state.known { background: var(--good); border-color: var(--good); }
.q .state.known::after { content: ""; width: 6px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.q .state.learning { border-color: var(--star); }
.q .qbody { padding: 0 16px 14px; border-top: 1px dashed var(--line); }
.q .src { font-size: 0.8rem; color: var(--muted); margin: 10px 0 0; font-style: italic; }
.mark-row { display: flex; gap: 8px; margin-top: 12px; }
.mark-row .btn { flex: 1; padding: 10px; font-size: 0.9rem; }

/* markdown content */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0.6em 0; }
.md ul, .md ol { padding-left: 1.3em; }
.md li { margin: 0.25em 0; }
.md strong { font-weight: 600; }
.md code { font-family: var(--f-mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.md pre {
  font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.5; background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 0.8em 0;
}
.md pre code { background: none; padding: 0; font-size: inherit; white-space: pre; }
.tbl { overflow-x: auto; margin: 0.8em 0; border: 1px solid var(--line); border-radius: 10px; }
.md table { border-collapse: collapse; font-size: 0.85rem; min-width: 100%; width: max-content; }
.md th, .md td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 6.5em; max-width: 18em; overflow-wrap: normal; }
.md th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md em { color: inherit; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }

/* ---------- flashcards ---------- */
.deck-picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.deck-picker::-webkit-scrollbar { display: none; }
.flash {
  min-height: 300px; display: flex; flex-direction: column; padding: 18px; gap: 12px;
}
.flash .front { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; line-height: 1.3; text-wrap: balance; }
.flash .hint { margin-top: auto; text-align: center; color: var(--muted); font-size: 0.85rem; }
.flash .answer { border-top: 1px dashed var(--line); padding-top: 12px; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade button { border-radius: 12px; padding: 12px 6px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.grade .again { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.grade .hard { color: var(--star); border-color: var(--star); background: var(--star-soft); }
.grade .easy { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.grade small { display: block; font-weight: 400; font-size: 0.72rem; opacity: 0.85; }

/* ---------- quiz ---------- */
.opt {
  width: 100%; text-align: left; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; line-height: 1.4;
}
.opt .letter { font-family: var(--f-mono); font-size: 0.8rem; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--code-bg); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.feedback { padding: 14px 16px; border-radius: 12px; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 4px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.score-big { font-family: var(--f-display); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- exams ---------- */
.exam-card { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 14px 16px; }
.exam-card .d { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.pill { font-family: var(--f-mono); font-size: 0.7rem; border-radius: 6px; padding: 2px 7px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.gray { background: var(--code-bg); color: var(--muted); }
.pages { display: flex; flex-direction: column; gap: 10px; }
.page-img { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: block; cursor: zoom-in; }
.viewer {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 16, 0.94); overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 56px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  -webkit-overflow-scrolling: touch;
}
.viewer img { display: block; background: #fff; max-width: none; }
.viewer .vbar {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; gap: 8px; justify-content: flex-end;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
}
.viewer .vbar button { background: #2a2f38; color: #f2f4f7; border: 1px solid #3c4350; border-radius: 10px; padding: 8px 14px; font-weight: 600; }

/* ---------- boards ---------- */
.board { padding: 14px 16px; }
.board h3 { font-family: var(--f-display); font-size: 1.05rem; margin: 0 0 8px; text-wrap: balance; }
.board.covered .md { filter: blur(7px); user-select: none; cursor: pointer; transition: filter 0.2s; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.switch { width: 46px; height: 28px; border-radius: 99px; background: var(--line); border: 0; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: left 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 21px; }


/* ---------- additions: actions, chips, segmented controls, sheet ---------- */
.stackgap { display: flex; flex-direction: column; gap: 8px; }
.center { text-align: center; }
.iconbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--muted);
  width: 36px; height: 36px; display: grid; place-items: center; flex: none; padding: 0;
}
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.on { color: var(--star); border-color: var(--star); background: var(--star-soft); }
.action { display: grid; grid-template-columns: 40px 1fr 20px; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; width: 100%; }
.action b { display: block; font-weight: 600; }
.action .aicon, .qbtn .aicon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.action .aicon svg, .qbtn .aicon svg { width: 22px; height: 22px; }
.action.accent { border-color: var(--accent); }
.action.accent .aicon { background: var(--accent); color: var(--surface); }
.action .chev { color: var(--muted); }
.action .chev svg { width: 18px; height: 18px; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.qbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; text-align: left; }
.qbtn b { font-weight: 600; margin-top: 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 600; color: var(--muted); font-size: 0.9rem; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.badge-hard { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.06em; color: var(--bad); background: var(--bad-soft); border-radius: 5px; padding: 1px 6px; }
.quiz-q { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; line-height: 1.4; text-wrap: pretty; }
details.formulas > summary { font-family: var(--f-display); font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
details.formulas > summary::after { content: "Hide"; font-family: var(--f-body); font-weight: 500; font-size: 0.8rem; color: var(--accent); }
details.formulas:not([open]) > summary::after { content: "Show"; }
details.formulas > summary::-webkit-details-marker { display: none; }
details.formulas[open] > summary { margin-bottom: 6px; }
.qhead-row { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 4px; padding-right: 10px; }
.qhead-row .save-btn { margin-top: 10px; width: 32px; height: 32px; border-color: transparent; background: none; }
.qhead-row .save-btn.on { background: none; border-color: transparent; }
.q > .qhead-row > button.qhead { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; padding: 14px 4px 14px 16px; }
.q .qtitle { display: block; font-weight: 600; line-height: 1.35; margin-top: 2px; }
.flash .front { margin-top: 2px; }
.toast {
  position: fixed; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60;
  bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 0.9rem; font-weight: 500;
  transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.sheet-wrap {
  position: fixed; inset: 0; z-index: 55; background: rgba(10, 12, 16, 0.45); display: flex; align-items: flex-end; justify-content: center;
  padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 1.2rem; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field .label { font-weight: 600; }
.field textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px; font-family: var(--f-mono); font-size: 0.75rem; resize: vertical; color: var(--ink); }
.btn.danger { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.viewer .vbar { align-items: center; color: #f2f4f7; }
.viewer .vbar button:disabled { opacity: 0.35; }
.viewer .vbar .grow { flex: 1; }

/* ---------- slides ---------- */
.jump { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 0.9rem; }
.slide-fig { margin: 0; }
.slide-img { width: 100%; display: block; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: zoom-in; aspect-ratio: 16 / 9; object-fit: contain; }
.note { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.note h3 { margin: 0; font-family: var(--f-display); font-size: 1.2rem; line-height: 1.3; text-wrap: balance; }
.tip { margin-top: 8px; padding: 12px 14px; border-radius: 10px; background: var(--star-soft); border-left: 3px solid var(--star); }
.tip b { color: var(--star); font-size: 0.85rem; letter-spacing: 0.04em; text-transform: uppercase; }
.tab { font-size: 0.68rem; }

/* ---------- interactive visuals ---------- */
.viz { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.viz-head h3 { margin: 2px 0 2px; font-family: var(--f-display); font-size: 1.1rem; line-height: 1.3; }
.viz-head p { margin: 0; }
.viz-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.viz-canvas { width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); touch-action: manipulation; }
.viz-canvas canvas { display: block; width: 100%; }
.viz-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.vbtn { border: 1px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 0.88rem; }
.vbtn.primary { background: var(--accent); color: var(--surface); }
.vseg { display: inline-flex; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.vseg button { border: 0; background: none; border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.vseg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.vslider { flex: 1 1 100%; display: flex; flex-direction: column; gap: 2px; font-size: 0.85rem; }
.vslider-top { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.vslider .vval { color: var(--ink); font-family: var(--f-mono); font-size: 0.8rem; }
.vslider input { width: 100%; accent-color: var(--accent); height: 28px; }
.viz-readout { font-size: 0.88rem; line-height: 1.5; background: var(--code-bg); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.viz-readout .muted { color: var(--muted); }
.viz-readout table.cm { border-collapse: collapse; margin-bottom: 6px; font-size: 0.85rem; }
.viz-readout table.cm th, .viz-readout table.cm td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; font-variant-numeric: tabular-nums; }
.viz-readout table.cm th { color: var(--muted); font-weight: 500; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.vleg { display: inline-flex; align-items: center; gap: 6px; }
.vleg .sw { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid var(--sw); }
.vleg .sw.dash { border-top-style: dashed; }
.vleg .sw.box { height: 10px; border: 0; background: var(--sw); border-radius: 2px; opacity: 0.7; }
.vleg .sw.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--sw); }
.viz-look summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--accent); }
.viz-look ul { margin: 6px 0 0; padding-left: 1.2em; font-size: 0.9rem; }
.viz-look li { margin: 3px 0; }

/* ---------- study time ---------- */
.daybars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 120px; align-items: end; }
.daycol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; min-width: 0; }
.daycol i { display: block; width: 100%; max-width: 22px; background: var(--c1); border-radius: 4px 4px 0 0; opacity: 0.75; }
.daycol i.today { opacity: 1; }
.daycol .dv { font-size: 0.7rem; color: var(--ink); min-height: 1em; }
.daycol .dl { font-size: 0.62rem; color: var(--muted); white-space: nowrap; }
.trow { display: flex; flex-direction: column; gap: 5px; text-align: left; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0 4px; color: var(--ink); }
.trow .tlabel { font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbar { display: flex; gap: 2px; height: 10px; background: var(--code-bg); border-radius: 5px; overflow: hidden; }
.tbar i { display: block; height: 100%; }
.tbar i:last-child { border-radius: 0 4px 4px 0; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 560px) { .flash .front { font-size: 1.4rem; } }
</style>
